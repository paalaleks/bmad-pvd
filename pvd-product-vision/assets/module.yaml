code: pvd
name: "Product Vision Document"
description: "Before-anything workflow: overarching PVD and phase offsets for collision-safe child BMM PRDs."
module_version: 1.0.0
default_selected: true
module_greeting: >
  Product Vision Document (pvd) is registered. Run pvd-product-vision to forge a program spine
  under {project-root}/__pvd/ (outside _bmad-output). Or pass setup/configure to re-run module setup.
  Accepted team customizes land under _bmad/custom/ (bmad-prd.toml, bmad-code-review.toml).

# Optional: install team customizes during setup (see module-setup.md).

directories:
  - "{project-root}/__pvd"
  - "{project-root}/__pvd/offsets"

post-install-notes: >
  Next: invoke pvd-product-vision with a product brief (Create). Package path is {project-root}/__pvd/.
  After finalize, run bmad-prd per phase with pvd.md + the phase offset. After a phase build completes,
  Close archives _bmad-output/docs only — __pvd/ stays. If you accepted team customizes, check
  _bmad/custom/bmad-prd.toml and _bmad/custom/bmad-code-review.toml.
